[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x"
version = "1.0.0"
description = "Offline research workbench for intrusion detection, reliability and evidence-grounded triage"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.6,<1.9",
  "joblib>=1.3,<2",
  "threadpoolctl>=3,<4",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cuda = ["torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel_x*"]

[tool.setuptools.package-data]
"sentinel_x.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
