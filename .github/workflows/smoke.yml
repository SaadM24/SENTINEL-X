name: Smoke tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/research.txt -e ".[test]"
      - run: python scripts/run_pipeline.py --mode smoke --run local-ci --tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-status
          path: results/workflow/local-ci/
